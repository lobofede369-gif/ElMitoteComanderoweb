name: Verificar diseño premium

on:
  push:
    branches:
      - "design/**"
      - "preview/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ui-static:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Validar sintaxis JavaScript
        run: |
          node --check static/app.js
          node --check static/pos-ui-v3.js
          node --check static/sw.js

      - name: Comprobar integración visual sin reemplazar módulos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('static/index.html').read_text(encoding='utf-8')
          app = Path('static/app.js').read_text(encoding='utf-8')
          css = Path('static/theme-obsidian-titanium.css').read_text(encoding='utf-8')
          modules = Path('static/theme-obsidian-modules.css').read_text(encoding='utf-8')
          motion = Path('static/theme-luxury-motion.css').read_text(encoding='utf-8')
          sw = Path('static/sw.js').read_text(encoding='utf-8')
          assert '/static/theme-obsidian-titanium.css?v=1' in html
          assert '/static/theme-obsidian-modules.css?v=2' in html
          assert '/static/app.js?v=15' in html
          assert '/static/pos-ui-v3.js?v=6' in html
          assert 'theme-obsidian-modules.css?v=2' in sw
          assert '/static/theme-luxury-motion.css?v=1' in html
          assert 'theme-luxury-motion.css?v=1' in sw
          assert '@media(prefers-reduced-motion:reduce)' in motion
          fast = Path('static/theme-service-fast.css').read_text(encoding='utf-8')
          waiter = Path('static/pos-ui-v3.js').read_text(encoding='utf-8')
          assert '/static/theme-service-fast.css?v=1' in html
          assert '/static/theme-service-fast.css?v=1' in sw
          assert 'mitote-comandas-v18' in sw
          assert 'pos-search' in waiter and 'applyCatalogFilter()' in waiter
          assert 'obs.observe(content,{childList:true});' in waiter
          assert 'subtree:true' not in waiter
          assert '.table-choice-grid' in fast and '.pos-search-wrap' in fast
          assert 'prefers-reduced-motion' in fast
          assert '#login[hidden],#app[hidden]' in css
          assert 'premium-shortcut-grid' in modules
          assert 'function showOverview()' in app
          for section in ('all', 'tables', 'tickets', 'cashier', 'cash',
                          'products', 'inventory', 'users', 'tips', 'approvals', 'audit'):
              assert "'"+section+"'" in app, section
          for name in ('showAccounts', 'showNew', 'showOrders',
                       'showStation', 'showCashier', 'showCash', 'showTips',
                       'showProducts', 'showInventory', 'showUsers',
                       'showApprovals', 'showAudit', 'showOverview'):
              assert 'function '+name+'(' in app, name
          for path in (Path('static/theme-obsidian-titanium.css'), Path('static/theme-obsidian-modules.css'), Path('static/theme-luxury-motion.css'), Path('static/theme-service-fast.css')):
              text = path.read_text(encoding='utf-8')
              assert text.count('{') == text.count('}'), path
          assert "const canEditAccount=state.user?.role==='owner'" in app
          assert "const actionsHtml=canEditAccount" in app
          backend = Path('app.py').read_text(encoding='utf-8')
          for handler in ('rename_account','transfer_account_table','merge_accounts',
                          'split_account','reassign','reopen_closed_account','void_account'):
              assert 'def '+handler+'(' in backend
          print('Validaciones estructurales y propietario exclusivo correctas.')
          PY

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencias para pruebas de permisos
        run: python -m pip install -r requirements.txt httpx==0.28.1

      - name: Validar API y roles con SQLite temporal
        run: python -m scripts.test_owner_permissions
